name: Check Job Availability

# Expiry runs inside Lamiiine/scrape-jobs after each scrape, which also
# pushes to main and triggers Build and Deploy. Leaving this on a schedule
# reintroduced a GITHUB_TOKEN push that does not deploy, and the commit
# message left "$REMOVED" unexpanded.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Expiry lives in scrape-jobs
        run: echo "Stale listings are removed by the Daily Job Scraper in Lamiiine/scrape-jobs."
